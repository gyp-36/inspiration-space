server:
  port: 8080
# ===== 数据库配置 =====
spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:localhost}:3306/inspiration-space?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: 573488

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # ===== Redis 配置 =====
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0

  # ===== 安全配置 =====
  security:
    user:
      name: admin
      password: 123456
      roles: ADMIN

# ===== MyBatis-Plus 配置 =====
mybatis-plus:
  mapper-locations: classpath*:com/is/inspirationspaceclient/**/mapper/xml/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# ===== RabbitMQ 配置 =====
rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest
  exchange: notification_exchange




# ===== minio配置 =====
minio:
  endpoint: http://127.0.0.1:9000
  access-key: minioadmin
  secret-key: minioadmin
  region: us-east-1
  secure: false
  connect-timeout: 60
  write-timeout: 60
  read-timeout: 60


# ===== 雪花算法配置 =====
snowflake:
  datacenter-id: ${SNOWFLAKE_DC_ID:1}
  machine-id: ${SNOWFLAKE_MACHINE_ID:1}

alipay:
  easy:
    app-id: 9021000157618271
    protocol: https
    gateway-host: openapi-sandbox.dl.alipaydev.com
    sign-type: RSA2
    merchant-private-key: 
    alipay-public-key: 
    notify-url: http://localhost:8080/pay-order/notify